version: 2

models:

  # ---------------------------------------------------------------------------
  # STAGING
  # ---------------------------------------------------------------------------

  - name: stg_customers
    description: >
      Cleans and standardizes customer snapshot data from the RAW layer.
      Each snapshot represents the authoritative customer state delivered
      for a given snapshot date. This model prepares customer attributes
      for downstream SCD Type 2 modeling.

    columns:
      - name: customer_id
        description: >
          Source business identifier for the customer.

      - name: customer_name
        description: >
          Customer name after trimming whitespace.

      - name: customer_birth_date
        description: >
          Customer date of birth parsed from the source representation.

      - name: mobile_number
        description: >
          Customer mobile number standardized as a string.

      - name: email_address
        description: >
          Customer email address after trimming, lowercasing, and basic
          format validation. Invalid email values are represented as NULL.

      - name: row_updated_at
        description: >
          Source-provided date representing when the customer record was
          updated. Used as the effective date for SCD Type 2 customer
          versions.

      - name: snapshot_date
        description: >
          Date on which this customer snapshot was delivered. This represents
          source delivery metadata and is not the effective validity date of
          the customer attributes.


  - name: stg_events
    description: >
      Cleans and standardizes event data from the RAW layer for the event
      dimension. Event records represent the current state of each event.

    columns:
      - name: event_id
        description: >
          Source business identifier for the event.

      - name: event_name
        description: >
          Name of the event after trimming whitespace.

      - name: event_category
        description: >
          Event category standardized to lowercase.

      - name: event_datetime
        description: >
          Date and time at which the event is scheduled to occur.

      - name: venue_id
        description: >
          Identifier of the venue hosting the event.


  - name: stg_venues
    description: >
      Cleans and standardizes venue data from the RAW layer for the venue
      dimension.

    columns:
      - name: venue_id
        description: >
          Source business identifier for the venue.

      - name: venue_name
        description: >
          Venue name after trimming whitespace.

      - name: city
        description: >
          City name standardized to title case.

      - name: pincode
        description: >
          Venue postal code standardized to numeric characters only.


  - name: stg_tickets
    description: >
      Cleans and standardizes ticket sales data from the RAW layer.
      Each row represents an individual ticket sale and includes the
      ingestion timestamp required for downstream incremental processing.

    columns:
      - name: ticket_id
        description: >
          Unique source business identifier for the ticket sale.

      - name: customer_id
        description: >
          Source identifier of the customer who purchased the ticket.

      - name: event_id
        description: >
          Source identifier of the event for which the ticket was purchased.

      - name: sales_channel
        description: >
          Channel through which the ticket was purchased, standardized to
          lowercase.

      - name: purchase_datetime
        description: >
          Date and time at which the ticket purchase occurred.

      - name: ticket_price
        description: >
          Base price of the ticket before the convenience fee.

      - name: convenience_fee
        description: >
          Convenience fee charged for the ticket purchase.

      - name: total_amount
        description: >
          Total customer charge for the ticket, defined in this project as
          ticket price plus convenience fee and used as the revenue measure.

      - name: ingestion_timestamp
        description: >
          Timestamp representing when the ticket record was delivered to
          the warehouse ingestion layer. Used as the incremental processing
          watermark for ticket sales.


  # ---------------------------------------------------------------------------
  # MARTS
  # ---------------------------------------------------------------------------

  - name: dim_customer
    description: >
      Slowly Changing Dimension Type 2 containing historical versions of
      customer attributes. Each customer version remains available so that
      ticket sales can be associated with the customer information that was
      valid when the purchase occurred.

      Customer versions are identified by a surrogate key. The source
      row_updated_at value is used as the effective date of each version,
      while snapshot_date represents only the delivery date of the source
      snapshot.

    columns:
      - name: customer_sk
        description: >
          Surrogate key identifying a specific historical version of a
          customer.

      - name: customer_id
        description: >
          Stable source business identifier for the customer across all
          historical versions.

      - name: customer_name
        description: >
          Customer name associated with this historical version.

      - name: customer_birth_date
        description: >
          Customer date of birth associated with this historical version.

      - name: mobile_number
        description: >
          Customer mobile number associated with this historical version.

      - name: email_address
        description: >
          Customer email address associated with this historical version.

      - name: valid_from
        description: >
          Inclusive effective date from which this customer version is
          considered valid.

      - name: valid_to
        description: >
          Exclusive effective date at which this customer version ceased
          to be valid. Current records use 9999-12-31 as the open-ended
          upper boundary.

      - name: is_current
        description: >
          Indicates whether this is the currently active version of the
          customer.


  - name: dim_event
    description: >
      Slowly Changing Dimension Type 0 containing the current state of
      events. Event attributes are maintained as the latest known values,
      with event_id used as the business key.

      Event venue assignment is treated as stable once ticket sales begin,
      allowing ticket facts to retain the event's venue relationship without
      requiring historical event versions.

    columns:
      - name: event_id
        description: >
          Source business identifier for the event and unique key of the
          event dimension.

      - name: event_name
        description: >
          Current event name.

      - name: event_category
        description: >
          Current event category.

      - name: event_datetime
        description: >
          Scheduled date and time of the event.

      - name: venue_id
        description: >
          Identifier of the venue currently associated with the event.


  - name: dim_venue
    description: >
      Slowly Changing Dimension Type 0 containing the current state of
      venues. Venue records are maintained using venue_id as the business
      key, with new records inserted and existing records updated when
      source values change.

    columns:
      - name: venue_id
        description: >
          Source business identifier for the venue and unique key of the
          venue dimension.

      - name: venue_name
        description: >
          Current venue name.

      - name: city
        description: >
          Current city in which the venue is located.

      - name: pincode
        description: >
          Current postal code of the venue.


  - name: fct_ticket_sales
    description: >
      Incremental fact table containing one row per individual ticket sold
      to a customer for an event. The fact records the customer version
      that was valid at the time of purchase and links each sale to its
      event and venue.

      Ticket sales are incrementally processed using ingestion_timestamp.
      A ticket_id is treated as the business key, allowing newly delivered
      tickets to be inserted and corrections to previously delivered
      tickets to update the existing fact record.

    columns:
      - name: ticket_sale_sk
        description: >
          Deterministic surrogate key for the ticket sale, generated from
          ticket_id.

      - name: ticket_id
        description: >
          Unique source business identifier for the ticket sale.

      - name: customer_sk
        description: >
          Surrogate key of the customer dimension version that was valid
          when the ticket was purchased.

      - name: event_id
        description: >
          Identifier of the event associated with the ticket sale.

      - name: venue_id
        description: >
          Identifier of the venue associated with the event at the time
          represented by the fact.

      - name: sales_channel
        description: >
          Channel through which the ticket was purchased.

      - name: purchase_datetime
        description: >
          Date and time at which the ticket was purchased.

      - name: ticket_price
        description: >
          Base ticket price before the convenience fee.

      - name: convenience_fee
        description: >
          Convenience fee charged for the ticket purchase.

      - name: total_amount
        description: >
          Total customer charge for the ticket, defined as ticket price
          plus convenience fee and used as the revenue measure.

      - name: ingestion_timestamp
        description: >
          Timestamp representing when the ticket record was delivered to
          the ingestion layer. Used as the incremental processing watermark.
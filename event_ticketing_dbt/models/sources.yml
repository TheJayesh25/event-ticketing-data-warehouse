version: 2

sources:
  - name: ticketing
    schema: raw
    tables:

      - name: raw_customer
        identifier: raw_customer
        columns:
          - name: customer_id
            data_tests:
              - not_null

          - name: name
            data_tests:
              - not_null

          - name: birth_date
            data_tests: 
              - not_null
            
          - name: mobile_no
            data_tests: 
              - not_null
            
          - name: email
            data_tests: 
              - not_null

          - name: updated_at
            data_tests: 
              - not_null


      - name: raw_event
        identifier: raw_event
        columns:
          - name: event_id
            data_tests:
              - not_null
              - unique

          - name: name
            data_tests:
              - not_null

          - name: category
            data_tests: 
              - not_null
            
          - name: date
            data_tests: 
              - not_null
            
          - name: venue_id
            data_tests: 
              - not_null

          - name: venue
            data_tests: 
              - not_null
      

      - name: raw_ticket
        identifier: raw_ticket
        columns:
          - name: ticket_id
            data_tests:
              - not_null
              - unique

          - name: customer_id
            data_tests:
              - not_null

          - name: event_id
            data_tests: 
              - not_null
            
          - name: sales_channel
            data_tests: 
              - not_null
            
          - name: purchase_timestamp
            data_tests: 
              - not_null

          - name: ticket_price
            data_tests: 
              - not_null

          - name: convenience_fee
            data_tests: 
              - not_null

          - name: total_amount
            data_tests: 
              - not_null
      

      - name: raw_venue
        identifier: raw_venue
        columns:
          - name: venue_id
            data_tests:
              - not_null
              - unique

          - name: venue_name
            data_tests:
              - not_null

          - name: city
            data_tests: 
              - not_null
            
          - name: pincode
            data_tests: 
              - not_null